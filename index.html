<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Oyunu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 3.5rem;
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .info-box {
            text-align: center;
            flex: 1;
            min-width: 150px;
        }

        .info-label {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 2rem;
            font-weight: bold;
            color: #60a5fa;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
            max-height: 600px;
            overflow-y: auto;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }

        .tile {
            aspect-ratio: 3/4;
            background: linear-gradient(145deg, #f0e6d2, #e1d4b8);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .tile.selected {
            background: linear-gradient(145deg, #fbbf24, #f59e0b);
            transform: scale(1.1);
            z-index: 10;
        }

        .tile.matched {
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        .tile.blocked {
            background: linear-gradient(145deg, #94a3b8, #64748b);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .tile.hint {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 180px;
        }

        .btn-start {
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
            color: white;
            box-shadow: 0 5px 20px rgba(67, 97, 238, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.4);
        }

        .btn-hint {
            background: linear-gradient(90deg, #8b5cf6, #7c3aed);
            color: white;
        }

        .btn-reset {
            background: linear-gradient(90deg, #ef4444, #dc2626);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .instructions {
            margin-top: 30px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }

        .combo-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(90deg, #f59e0b, #ea580c);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.3);
            animation: slideIn 0.3s ease;
            display: none;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .match-effect {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            animation: celebrate 1s ease;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes celebrate {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            
            .game-board {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 10px;
            }
            
            .tile {
                font-size: 2rem;
            }
            
            .btn {
                padding: 12px 25px;
                min-width: 140px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 2rem;
            }
            
            .game-board {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
                gap: 8px;
            }
            
            .tile {
                font-size: 1.8rem;
            }
            
            .info-value {
                font-size: 1.5rem;
            }
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="combo-display" id="comboDisplay"></div>
    
    <div class="container" id="gameContainer">
        <div class="header">
            <h1 class="title">MAHJONG OYUNU</h1>
            <p class="subtitle">Taşları eşleştir, piramidi temizle!</p>
        </div>

        <div class="game-info">
            <div class="info-box">
                <div class="info-label">SKOR</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">LEVEL</div>
                <div class="info-value" id="level">1</div>
            </div>
            <div class="info-box">
                <div class="info-label">KALAN</div>
                <div class="info-value" id="remaining">144</div>
            </div>
            <div class="info-box">
                <div class="info-label">SÜRE</div>
                <div class="info-value" id="time">0:00</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- Tiles will be generated here -->
        </div>

        <div class="controls">
            <button class="btn btn-start" id="startBtn">
                <span>🎮</span> OYUNU BAŞLAT
            </button>
            <button class="btn btn-hint" id="hintBtn" disabled>
                <span>💡</span> İPUCU GÖSTER
            </button>
            <button class="btn btn-reset" id="resetBtn" disabled>
                <span>🔄</span> YENİDEN BAŞLA
            </button>
        </div>

        <div class="instructions">
            <p><strong>🎯 NASIL OYNANIR:</strong> Üstü açık iki aynı taşa tıklayarak eşleştir. Üstünde başka taş olmayanlar seçilebilir.</p>
            <p><strong>✨ İPUCU:</strong> Takılırsanız ipucu butonuna basın. Eşleştirme her zaman mümkün!</p>
        </div>
    </div>

    <script>
        // Mahjong symbols (simplified for 2D)
        const SYMBOLS = [
            '●', '♦', '♠', '♣', '★', '☆', '☀', '☾', '☁',
            '⚡', '❄', '🔥', '💧', '🌱', '🌸', '🍀', '🌹', '🌻',
            '🍎', '🍌', '🍇', '🍓', '🍒', '🍋', '🍊', '🍉', '🍑',
            '🎵', '🎶', '🎨', '🎭', '⚽', '🏀', '🎾', '🏐', '🎯',
            '🚗', '✈', '🚀', '🚢', '🏠', '🏰', '🌉', '🗼', '🗽'
        ];

        // Game state
        let gameState = {
            level: 1,
            score: 0,
            remaining: 144,
            selected: [],
            matched: 0,
            gameStarted: false,
            tiles: [],
            combo: 0,
            gameTime: 0,
            timer: null,
            highScore: localStorage.getItem('mahjongHighScore') || 0
        };

        // DOM Elements
        const gameBoard = document.getElementById('gameBoard');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const remainingElement = document.getElementById('remaining');
        const timeElement = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const hintBtn = document.getElementById('hintBtn');
        const resetBtn = document.getElementById('resetBtn');
        const comboDisplay = document.getElementById('comboDisplay');
        const progressFill = document.getElementById('progressFill');

        // Initialize game
        function initGame() {
            // Generate all symbols (4 of each)
            let allSymbols = [];
            for (let i = 0; i < SYMBOLS.length; i++) {
                for (let j = 0; j < 4; j++) {
                    allSymbols.push(SYMBOLS[i]);
                }
            }
            
            // Shuffle and take first 144
            gameState.tiles = shuffleArray(allSymbols).slice(0, 144);
            
            // Create pyramid layout positions
            const positions = generatePyramidLayout();
            
            // Clear board
            gameBoard.innerHTML = '';
            
            // Create tile elements
            gameState.tiles.forEach((symbol, index) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.index = index;
                tile.dataset.symbol = symbol;
                tile.dataset.blocked = 'true';
                tile.textContent = symbol;
                tile.style.transform = `translate(${positions[index].x * 5}px, ${positions[index].y * 5}px)`;
                
                tile.addEventListener('click', () => handleTileClick(index));
                
                gameBoard.appendChild(tile);
            });
            
            updateUI();
            updateBlockedStatus();
        }

        // Shuffle array using Fisher-Yates algorithm
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Generate 2D pyramid layout
        function generatePyramidLayout() {
            const positions = [];
            const layers = 4;
            const baseRows = 6;
            const baseCols = 10;
            
            for (let layer = 0; layer < layers; layer++) {
                const rows = baseRows - layer;
                const cols = baseCols - layer * 2;
                
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        positions.push({
                            x: (col - cols/2) * 1.2 + layer * 0.6,
                            y: row * 1.2 + layer * 0.6
                        });
                    }
                }
            }
            
            return positions.slice(0, 144);
        }

        // Update which tiles are blocked
        function updateBlockedStatus() {
            const tiles = document.querySelectorAll('.tile');
            const positions = [];
            
            // Get all tile positions
            tiles.forEach((tile, index) => {
                if (tile.classList.contains('matched')) return;
                
                const rect = tile.getBoundingClientRect();
                positions[index] = {
                    x: rect.left,
                    y: rect.top,
                    width: rect.width,
                    height: rect.height
                };
            });
            
            // Check for overlaps
            tiles.forEach((tile, index) => {
                if (tile.classList.contains('matched')) {
                    tile.dataset.blocked = 'false';
                    return;
                }
                
                let blocked = false;
                const pos1 = positions[index];
                
                for (let i = 0; i < positions.length; i++) {
                    if (i === index || !positions[i]) continue;
                    
                    const pos2 = positions[i];
                    const tile2 = tiles[i];
                    
                    if (tile2.classList.contains('matched')) continue;
                    
                    // Check if tile2 is above tile1 (simplified 3D check)
                    if (Math.abs(pos1.x - pos2.x) < pos1.width * 0.8 &&
                        Math.abs(pos1.y - pos2.y) < pos1.height * 0.8) {
                        
                        // Check which tile is "higher" (based on position in array)
                        if (i < index) {
                            blocked = true;
                            break;
                        }
                    }
                }
                
                tile.dataset.blocked = blocked.toString();
                if (blocked) {
                    tile.classList.add('blocked');
                } else {
                    tile.classList.remove('blocked');
                }
            });
        }

        // Handle tile click
        function handleTileClick(index) {
            if (!gameState.gameStarted) return;
            
            const tile = document.querySelector(`.tile[data-index="${index}"]`);
            if (!tile || tile.dataset.blocked === 'true') return;
            if (tile.classList.contains('matched')) return;
            
            // Toggle selection
            if (gameState.selected.includes(index)) {
                // Deselect
                gameState.selected = gameState.selected.filter(i => i !== index);
                tile.classList.remove('selected');
            } else {
                // Select
                if (gameState.selected.length >= 2) return;
                gameState.selected.push(index);
                tile.classList.add('selected');
                
                // Check for match if two tiles are selected
                if (gameState.selected.length === 2) {
                    setTimeout(checkMatch, 300);
                }
            }
        }

        // Check if selected tiles match
        function checkMatch() {
            const [index1, index2] = gameState.selected;
            const tile1 = document.querySelector(`.tile[data-index="${index1}"]`);
            const tile2 = document.querySelector(`.tile[data-index="${index2}"]`);
            
            if (tile1.dataset.symbol === tile2.dataset.symbol) {
                // Match found!
                showCelebration();
                
                gameState.combo++;
                if (gameState.combo > 1) {
                    showCombo(gameState.combo);
                }
                
                const points = 25 + (gameState.combo * 5);
                gameState.score += points;
                
                // Mark as matched
                tile1.classList.add('matched');
                tile2.classList.add('matched');
                
                gameState.matched += 2;
                gameState.remaining -= 2;
                
                // Check level complete
                if (gameState.matched >= 144) {
                    levelComplete();
                }
            } else {
                // No match
                gameState.combo = 0;
                tile1.classList.remove('selected');
                tile2.classList.remove('selected');
            }
            
            gameState.selected = [];
            updateUI();
            updateBlockedStatus();
        }

        // Show celebration effect
        function showCelebration() {
            const effects = ['✨', '🎉', '⭐', '💥', '🔥', '💎'];
            const effect = effects[Math.floor(Math.random() * effects.length)];
            
            const celebration = document.createElement('div');
            celebration.className = 'match-effect';
            celebration.textContent = effect;
            document.body.appendChild(celebration);
            
            setTimeout(() => {
                celebration.remove();
            }, 1000);
        }

        // Show combo display
        function showCombo(combo) {
            comboDisplay.textContent = `COMBO x${combo}!`;
            comboDisplay.style.display = 'block';
            
            setTimeout(() => {
                comboDisplay.style.display = 'none';
            }, 2000);
        }

        // Level complete
        function levelComplete() {
            setTimeout(() => {
                alert(`🎊 Tebrikler! Level ${gameState.level} tamamlandı!\n\nPuan: ${gameState.score}\nSonraki level'e geçiliyor...`);
                gameState.level++;
                gameState.combo = 0;
                gameState.matched = 0;
                gameState.remaining = 144;
                startGame();
            }, 500);
        }

        // Start game
        function startGame() {
            gameState.gameStarted = true;
            gameState.selected = [];
            gameState.matched = 0;
            gameState.remaining = 144;
            
            // Start timer
            gameState.gameTime = 0;
            if (gameState.timer) clearInterval(gameState.timer);
            gameState.timer = setInterval(() => {
                gameState.gameTime++;
                updateTimeDisplay();
            }, 1000);
            
            initGame();
            updateButtonStates();
        }

        // Update UI
        function updateUI() {
            scoreElement.textContent = gameState.score;
            levelElement.textContent = gameState.level;
            remainingElement.textContent = gameState.remaining;
            
            const progress = ((144 - gameState.remaining) / 144) * 100;
            progressFill.style.width = `${progress}%`;
            
            // Update high score if needed
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('mahjongHighScore', gameState.score);
            }
        }

        // Update time display
        function updateTimeDisplay() {
            const minutes = Math.floor(gameState.gameTime / 60);
            const seconds = gameState.gameTime % 60;
            timeElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // Update button states
        function updateButtonStates() {
            startBtn.disabled = gameState.gameStarted;
            hintBtn.disabled = !gameState.gameStarted;
            resetBtn.disabled = !gameState.gameStarted;
            
            if (gameState.gameStarted) {
                startBtn.innerHTML = '<span>⏸️</span> OYUN DEVAM EDİYOR';
            } else {
                startBtn.innerHTML = '<span>🎮</span> OYUNU BAŞLAT';
            }
        }

        // Show hint
        function showHint() {
            if (!gameState.gameStarted) return;
            
            const tiles = document.querySelectorAll('.tile:not(.matched):not(.blocked)');
            const symbols = new Map();
            
            // Find matching pairs
            for (const tile of tiles) {
                const symbol = tile.dataset.symbol;
                if (!symbols.has(symbol)) {
                    symbols.set(symbol, []);
                }
                symbols.get(symbol).push(tile);
            }
            
            // Find a pair to hint
            for (const [symbol, tileList] of symbols) {
                if (tileList.length >= 2) {
                    // Highlight the pair
                    tileList[0].classList.add('hint');
                    tileList[1].classList.add('hint');
                    
                    setTimeout(() => {
                        tileList[0].classList.remove('hint');
                        tileList[1].classList.remove('hint');
                    }, 2000);
                    
                    // Deduct points for hint
                    gameState.score = Math.max(0, gameState.score - 10);
                    updateUI();
                    return;
                }
            }
        }

        // Reset game
        function resetGame() {
            clearInterval(gameState.timer);
            gameState = {
                level: 1,
                score: 0,
                remaining: 144,
                selected: [],
                matched: 0,
                gameStarted: false,
                tiles: [],
                combo: 0,
                gameTime: 0,
                timer: null,
                highScore: localStorage.getItem('mahjongHighScore') || 0
            };
            
            gameBoard.innerHTML = '';
            updateUI();
            updateButtonStates();
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        hintBtn.addEventListener('click', showHint);
        resetBtn.addEventListener('click', resetGame);

        // Initialize
        updateButtonStates();
        updateUI();

        // Instructions alert
        setTimeout(() => {
            if (!localStorage.getItem('mahjongShownInstructions')) {
                alert('🎮 MAHJONG OYUNU\n\n' +
                      '🎯 NASIL OYNANIR:\n' +
                      '1. Üstü açık (gri olmayan) iki taşa tıkla\n' +
                      '2. Aynı sembolleri eşleştir\n' +
                      '3. Tüm taşları temizle, level atla!\n\n' +
                      '✨ İPUÇLARI:\n' +
                      '• Üstü açık olmayan taşlar seçilemez\n' +
                      '• Hızlı eşleştirmeler bonus puan verir\n' +
                      '• Takılırsan ipucu butonunu kullan');
                localStorage.setItem('mahjongShownInstructions', 'true');
            }
        }, 1000);

        // Add keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                showHint();
            } else if (e.key === 'r' || e.key === 'R') {
                resetGame();
            } else if (e.key === ' ' || e.key === 'Spacebar') {
                if (!gameState.gameStarted) {
                    startGame();
                }
            }
        });
    </script>
</body>
</html>
